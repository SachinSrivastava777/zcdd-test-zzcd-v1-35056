<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 My Todo List</h1>

        <form class="add-form" action="{{ url_for('add') }}" method="POST">
            <input type="text" name="task" placeholder="Add a new task..." required autofocus>
            <button type="submit">Add</button>
        </form>

        {% if todos %}
        <ul class="todo-list">
            {% for todo in todos %}
            <li class="{{ 'done' if todo.done else '' }}">
                <form action="{{ url_for('toggle', idx=loop.index0) }}" method="POST" class="toggle-form">
                    <button type="submit" class="checkbox">
                        {{ '✅' if todo.done else '⬜' }}
                    </button>
                </form>
                <span class="task-text">{{ todo.task }}</span>
                <form action="{{ url_for('delete', idx=loop.index0) }}" method="POST" class="delete-form">
                    <button type="submit" class="delete-btn">🗑️</button>
                </form>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty">No tasks yet. Add one above! 🎯</p>
        {% endif %}

        <div class="stats">
            {{ todos|selectattr('done')|list|length }} / {{ todos|length }} completed
        </div>
    </div>
</body>
</html>
